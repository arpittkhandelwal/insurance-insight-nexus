version: "3.9"

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENVIRONMENT=local
      - LLM_PROVIDER=mock
      - DATA_DIR=/app/data
      - DEMO_MODE=true
    volumes:
      - ./data:/app/data
      - ./ml/models:/app/ml/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend ───────────────────────────────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1

  # ── LocalStack (optional) — simulate S3/DynamoDB locally ──────────────────
  # localstack:
  #   image: localstack/localstack:latest
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     - SERVICES=s3,dynamodb
  #     - DEFAULT_REGION=ap-south-1
